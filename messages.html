<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — Esven</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .messages-shell {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
    max-width: 960px;
    margin: 24px auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: var(--card);
    min-height: 60vh;
  }
  .messages-list { border-right: 1px solid var(--line); overflow-y: auto; max-height: 74vh; }
  .messages-list-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
  .messages-list-item:hover, .messages-list-item.active { background: var(--pill); }
  .messages-list-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--pill); flex-shrink: 0; }
  .messages-list-avatar-empty { background: var(--accent); }
  .messages-list-meta { min-width: 0; flex: 1; }
  .messages-list-name { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .messages-list-preview { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .messages-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .messages-empty { padding: 40px 20px; text-align: center; color: var(--ink-soft); }
  .messages-thread { display: flex; flex-direction: column; height: 74vh; }
  .messages-thread-header { padding: 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .messages-thread-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .message-bubble { max-width: 70%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
  .message-bubble.mine { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .message-bubble.theirs { align-self: flex-start; background: var(--pill); border-bottom-left-radius: 4px; }
  .messages-thread-compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .messages-thread-compose input { flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 10px 16px; font: inherit; }
  @media (max-width: 720px) {
    .messages-shell { grid-template-columns: 1fr; margin: 0; border-radius: 0; }
    .messages-list { max-height: none; }
    .messages-list, .messages-thread { display: none; }
    .messages-shell.showing-list .messages-list { display: block; }
    .messages-shell.showing-thread .messages-thread { display: flex; }
    .messages-thread-header .back-to-list { display: inline; }
  }
  .messages-thread-header .back-to-list { display: none; text-decoration: none; color: inherit; }
</style>
</head>
<body>

<div class="header-wrap">
  <header class="site-header">
    <a href="index.html" class="logo">Esven</a>
    <div id="auth-bar"></div>
  </header>
</div>

<main>
  <h1 class="page-title">Messages</h1>
  <div class="messages-shell showing-list" id="messages-shell">
    <div class="messages-list" id="messages-list">
      <p class="empty-state">Loading...</p>
    </div>
    <div class="messages-thread" id="messages-thread">
      <div class="messages-empty">Select a conversation to start chatting.</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/push-config.js"></script>
<script src="js/push.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
