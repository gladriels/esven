<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Glares</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .product-detail-image {
    position: relative;
    width: 100%;
    max-height: 70vh;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
    background: var(--pill);
    display: flex;
  }
  .product-detail-image img { width: auto; height: auto; max-width: 100%; max-height: 70vh; margin: 0 auto; display: block; }
  .product-detail-price {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--accent);
    margin: 4px 0 16px;
  }
  .product-sold-out-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: var(--pill);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .size-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .size-chip {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
  }
  .size-chip.active { border-color: var(--ink); background: var(--ink); color: #fff; }

  .checkout-modal {
    position: fixed; inset: 0;
    background: rgba(17,17,17,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .checkout-modal.open { display: flex; }
  .checkout-modal-inner {
    background: var(--card);
    border-radius: 16px;
    padding: 26px;
    max-width: 360px;
    width: 100%;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
</style>
</head>
<body class="request-page profile-page">

<div class="header-wrap">
  <header class="site-header">
    <a href="index.html" class="logo">Glares</a>
    <div id="auth-bar"></div>
  </header>
</div>

<main>
  <a href="store.html" class="back-link">&larr; back to store</a>

  <section id="product-detail" class="request-detail">
    <p class="empty-state">Loading...</p>
  </section>
</main>

<div class="checkout-modal" id="checkout-modal">
  <div class="checkout-modal-inner">
    <button class="panel-close" id="checkout-close-btn">&times;</button>
    <h2 class="section-title">Checkout</h2>
    <div id="checkout-modal-body">
      <p class="empty-state">Loading...</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/push-config.js"></script>
<script src="js/push.js"></script>
<script src="js/messages-badge.js"></script>
<script src="js/store-item.js"></script>
</body>
</html>
